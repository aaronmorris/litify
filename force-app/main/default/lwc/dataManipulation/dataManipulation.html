<template>
	<div class="slds-box slds-theme_default">
		<lightning-record-edit-form object-api-name="Litify_Data_Manipulation__c" onsuccess={handleSuccess}>
			<lightning-messages></lightning-messages>
			<div class="slds-form-element">
				<span class="slds-form-element__label" id="file-selector-primary-label">Base 64 Encoded Text File</span>
				<div class="slds-form-element__control">
					<div class="slds-file-selector slds-file-selector_files">
						<div class="slds-file-selector__dropzone">
							<input type="file" onchange={handleNewSessionInput}
								class="slds-file-selector__input slds-assistive-text" accept="*.txt"
								id="file-upload-input-01"
								aria-labelledby="file-selector-primary-label file-selector-secondary-label" />
							<label class="slds-file-selector__body" for="file-upload-input-01"
								id="file-selector-secondary-label">
								<span class="slds-file-selector__button slds-button slds-button_neutral">
									<svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
										<use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#upload"></use>
									</svg>Upload Files</span>
							</label>
						</div>
					</div>
				</div>
			</div>
			<template if:true={showFields}>
				<lightning-input-field field-name="Encoded__c" data-id="encoded" value={encodedString} disabled>
				</lightning-input-field>
				<lightning-input-field field-name="Decoded__c" data-id="decoded" value={decodedString} disabled>
				</lightning-input-field>
				<lightning-input-field field-name="Reversed__c" data-id="reversed" value={reversedString} disabled>
				</lightning-input-field>
				<div>
					<lightning-layout>
						<lightning-layout-item padding="around-small">
							<lightning-input type="toggle" label="Ignore Case" onchange={handleIgnoreCaseChange}>
							</lightning-input>
						</lightning-layout-item>
						<lightning-layout-item padding="around-small">
							<lightning-input type="toggle" label="Sort Characters"
								onchange={handleSortCharactersChange}>
							</lightning-input>
						</lightning-layout-item>
					</lightning-layout>
				</div>
				<lightning-tabset>
					<lightning-tab label="Chart">
						<c-chart chart-config={chartConfiguration}></c-chart>
					</lightning-tab>
					<lightning-tab label="Raw Data">
						<div id="rawData" data-id="rawData">{characterData}</div>
					</lightning-tab>
				</lightning-tabset>
			</template>
		</lightning-record-edit-form>
	</div>
</template>
