<template>
	<div class="slds-box slds-theme_default">
	<lightning-datatable
		key-field="Id"
		data={litifyCases}
		columns={columns}
		onrowaction={handleRowAction}
		sorted-by={sortBy}
		sorted-direction={sortDirection}
		onsort={handleSortData}
		hide-checkbox-column>
</lightning-datatable>
	<template if:true={modalIsOpen} style="z-index:1000;">
		<div style="height: 640px; z-index:100;">
			<section role="dialog" style="z-index:100;" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<header class="slds-modal__header" style="z-index:100;">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal} style="position:unset; float:right;">
							<lightning-icon icon-name="utility:close" size="medium">
							</lightning-icon>
							<span class="slds-assistive-text">Close</span>
						</button>
						<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Litify Case</h2>
					</header>
					<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
						<c-litify-case litify-case-id={litifyCaseId}></c-litify-case>
					</div>
				</div>
			</section>
		</div>
	</template>
	<br style="clear:both;" />
	<div style="text-align: center;"><lightning-button variant="brand" label="Add a New Case" title="Add a New Case" class="slds-m-left_x-small" onclick={openModal}></lightning-button></div>
	<br style="clear:both;" />
	<template if:true={showAssociations}>
		<c-associations case-id={litifyCaseId}></c-associations>
	</template>
</div>
</template>
